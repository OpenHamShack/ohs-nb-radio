  <g transform="rotate(50 19 19)">
    <path d="M 4 19 A 15 7.5 0 0 0 34 19 Z" fill="#cdd6e3"/>
    <line x1="19" y1="19" x2="19" y2="8" stroke="#cdd6e3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="19" cy="6.5" r="3.5" fill="#ffb547"/>
  </g>
  <path d="M 10 46 L 18 46 L 21 36 L 24 46 L 32 46 L 35 40 L 38 46 L 46 46 L 50 33 L 54 46"
        stroke="#4fd1e8" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
