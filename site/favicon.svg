<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon: a simplified version of packaging/openhamshack-nb.svg (the app and
  package icon) for 16 px rendering. The full icon's waterfall and gradient
  detail disappears at that size, so this keeps only what still reads small:
  the dark tile, the dish aimed up-right, and one cyan link arc. Drawn by
  hand, no external assets (house rule).
-->
