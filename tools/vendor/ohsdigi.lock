# ohsdigi, the FT8/FT4, Q65 and JS8 decoder and encoder and HSmodem's modem, as the store
# images carry it (BETA-PLAN D9 and decision 3: ohsdigi is the one decoder,
# built here in rust/ohsdigi by tools/build-wheels.sh). The wheels are not
# committed - binaries never are (tools/build-ohsdigi.sh) - so
# tools/build-store.sh copies them into the staged tree from
# ~/build/ohs-dist/ohsdigi (OHSDIGI_WHEELS), and both it and the store
# Containerfile check them against these hashes, the ones
# openhamshack-digimodes pins (ohs-libs carries no ohsdigi pin). Built from rust/ohsdigi at 53a3d1a (0.2.0:
# JS8 and Q65 beside FT8/FT4), the last commit to touch the crate when
# these were pinned; a crate change means new wheels, a new version (the
# folder keeps old wheels that published builds reference, so a name must
# never be reused) and new lines here, in one commit.
#
# Re-pinned at the family rename (22/10/2026): be8c102 re-vendored this
# repo's ohs-libs wheels once ohs-libs itself was renamed, but missed this
# file - these hashes still named the wheels built before the rename,
# whose module inside the .so's own package still carried the former
# name's short form, not "ohsdigi". A store build from main would have
# baked that into Radio's image. Hashes now name openhamshack-digimodes'
# re-vendored wheels (its requirements.lock, openhamshack-nb commit
# be8c102, rust/ohsdigi unchanged - same crate commit, same .so bytes,
# only the wrapping module renamed); no decoder behaviour changed.
#
# The .deb, AppImage, Windows and Mac builds carry the bare module from
# tools/build-ohsdigi.sh instead, as before; only the store form uses these.
# The 0.2.0 macOS wheel is not built yet: Mac builds run only from Brian's
# desktop-remote.sh, and the store form has no use for it.
