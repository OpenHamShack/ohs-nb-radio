# The shared OpenHamShack libraries these apps pin (REPO-LAYOUT 4): built by
# ~/ohs-libs tools/build.sh at ohs-libs main 326d251 (dataset 2026.10.3; the
# Store frees a dead thread's connection and has release_thread()), exact
# files, one commit per bump.
# A checkout imports them through ohscore/shacklibs.py; the packages unpack
# them beside ohscore (tools/build-deb.sh, build-windows.ps1, build-macos.sh,
# the store Containerfile), each checking these hashes first.
# shack-i18n is the string check's wheel (tools/i18n.py), from M1; not shipped.
# shack-cw alone was built from ohs-libs main 271b8e4: the CW decoder, Morse
# tables and bench that moved there from ohscore (main 47be138), now shared
# with Icom and Flex. The other wheels are unchanged since 326d251.
# shack-cw again, from ohs-libs main 9b242d0 (feature/cw-decode-accuracy,
# merged; its decoder is byte-identical to the branch's 14de87f, only
# shack_cw.corpus changed since): the squelch that no longer
# reads static or a neighbour's keying as Morse (Brian's 20 m report of
# 13/10/2026), Decoder(polarity=False) for Radio, feed_frames for a
# skimmer, and shack_cw.corpus, the decoder scored on real bands.
# shack-cw again, from ohs-libs feature/cw-skimmer 4581251 (not yet main;
# re-vendor from main when it merges): shack_cw.skim, the CW skimmer
# Radio runs (ohsradio/cwskim.py), and shack_cw.amplitudes; the decoder
# prints the same as 9b242d0's (its bench table is unchanged).
# shack-cw again, from ohs-libs feature/cw-spacing 7f041af: a BRANCH PIN,
# on top of feature/cw-skimmer (4581251 + the recovery tool and the
# matcher's re-spacing, calls.segment()). Decoders print CQ/DE glued to a
# call and split calls at letter gaps on real bands; the matcher now
# re-spaces each channel's words before looking for calls.
# Now ohs-libs main 7f041af: both branches fast-forwarded into main on
# 13/10/2026, so this is no longer a branch pin. A wheel rebuilt from main
# has the same files byte for byte (only the zip timestamps differ), so the
# vendored wheel and its hash are kept rather than churned.
# shack-rec, built from ohs-libs main b5937d9: recordings on the
# controller (FLAC receive audio, the recordings folder, range requests).
# Only the store form's server uses it, so only the store images carry it;
# no desktop form has a server (packaging/shack_vendor.py RUNTIME).
# shack-pad, built from ohs-libs feature/nb-pad-flicker ad23292
# (main 373333d's pad plus one commit): the AKP03E found on Windows/macOS
# by its vendor collection (usage page 0xFFA0), shack_pad.diagnose, test
# mode and DesktopPad.status() for Settings › Control pad; and a keep-alive
# every 10 s, without which the pad dropped every 39 s and every key
# flickered. Now ohs-libs main ad23292: the branch fast-forwarded into main
# on 16/10/2026, so this is no longer a branch pin. A wheel rebuilt from
# main has the same files byte for byte (only the zip timestamps differ),
# so the vendored wheel and its hash are kept rather than churned.
# All six, from ohs-libs main 53aa362 (21/10/2026): the OpenHamShack rename
# of ohs-libs itself (no former name is left inside any wheel - checked by
# unzipping each and searching its strings).
# No behaviour change, so every wheel's files are otherwise identical to
# the ones they replace.
# shack-spectrum, new, built as ~/ohs-libs tools/build.sh builds, from
# ohs-libs main f9809f2: the server encoder for spectrum/1 (CLIENT-UI-PLAN.md
# §2) - the binary row, per-client decimation, the levels window and
# latest-wins sending - for api/spectrum/v1. Like shack-rec only the store
# form's server uses it, so only the store images carry it.
# shack-ui, new, built as ~/ohs-libs tools/build.sh builds, from ohs-libs
# main e8a5129: the ui/1 screen builder (CLIENT-UI-PLAN.md §5) - Document,
# node(), native(), Bind and Action - and validate(), which checks a screen
# against the pinned schema and refuses any generic action that declares
# transmit (§5.6). Radio's ui/v1 routes build their screens with it so every
# app's screens pass the same checks. Only the store form's server uses it,
# and so far only Radio serves screens, so only Radio's image carries it
# (with Debian's python3-jsonschema, which validate() needs); NB's image
# gains it with NB's first screen.
# shack-packet, new, built as ~/ohs-libs tools/build.sh builds (from a
# `git archive` of python/shack_packet, so no checkout was written to), from
# ohs-libs main 2b615e9 (shack_packet itself last changed at 2603438,
# 22/10/2026), on 29/10/2026: the family's one packet modem - Bell 202
# AFSK 1200 receive, HDLC, AX.25, the APRS payload parser and the SDR
# monitor's channeliser and Pipeline - for Radio's APRS receive
# (ohsradio/aprs.py). Receive only: Radio imports shack_packet.sdr's
# Pipeline and shack_packet.aprs, never the engine, a radio link or
# anything that transmits. Only Radio's store image carries it, as with
# shack-ui; no desktop form has a server for a client to open the map.
# GPL-3.0-or-later, as this repo. Needs numpy, which every form has.
