# The SDRplay receivers in Radio's store image (store/radio/Containerfile):
# SDRplay's own API (closed source, from sdrplay.com; its licence is
# sdrplay_license.txt inside the installer) and SoapySDRPlay3, the MIT
# SoapySDR module for it (github.com/pothosware/SoapySDRPlay3, the tag's
# source archive). Debian ships neither. Not committed: the API is not ours
# to put in a GPL repository, and the module is built from source in the
# image. tools/build-store.sh copies both into the staged tree from
# SDRPLAY_DIST (default ~/build/ohs-dist/sdrplay; the build host keeps the installer
# in ~/vendor) and the Containerfile checks these hashes again before it
# unpacks anything.
