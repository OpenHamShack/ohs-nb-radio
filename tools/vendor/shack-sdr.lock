# shack-sdr, the decoder host, the Rust RTTY, PSK, SSTV, DAB, broadcast FM
# and AIS decoders, the runtime codec loader and the receive-only RTL-SDR and
# SDRplay sources (openhamshack docs/RADIO-SDR-PLAN.md, Milestones 1 and 2).
# Built by ohs-libs tools/build-sdr-wheels.sh at ohs-libs main 7b488bc
# (28/10/2026; still 0.2.0, no version bump; SHA256SUMS in
# ~/build/ohs-dist/shack-sdr-ais1 match the lines below): the `ais` decoder
# (both AIS channels from one IQ input, every message type a map needs,
# !AIVDM sentences) and ais_encode, ais_parse, ais_nmea and testsig_ais for
# the simulator's ships.
# 316e8b9 before it (shack-sdr-m2f): dab.survey(wait_s=), which listens on
# after a complete list for every service's programme type (the band
# scan's genre).
# 72d97c1 before it (shack-sdr-m2e): TII tuned on nine real Band III blocks (no names
# from a transmitter's intermodulation or a receiver's spurs; a weak one
# beside a loud one at confidence 0.3).
# 1de0f78 before it: DAB's data - SlideShow slides from X-PAD and
# packet mode, SPI station logos and programme guide (packet mode with
# FEC), DL Plus, and the FIC's service information (programme type,
# language, country, clock, user applications, announcements, service
# following, FIG 2 labels), checked on real captures of the local blocks;
# testsig_dab's `showcase_mjd`; and the PSK fix (an over's last character
# with no idle after it, a carrier step mid-over) from fix/psk-tail-and-step.
# 26191be before it: DAB's TII, the transmitters each ensemble is heard
# from (the feed's `tii`), the SNR read from the empty nulls, and
# testsig_dab's `sites` and `eid` for a single-frequency network.
# 30765af before it (23/10/2026): the `psk` decoder (PSK31/63/125, up to 16
# stations a session, never worse than psk.py on its golden sweep), the
# `sstv` decoder (18 modes, from a VIS header or from line syncs, never worse
# than sstv.py on its 116 fixtures) and the host's finished files
# (Host(files_dir, files_keep), host.file(s)) that SSTV's pictures go
# through. The wheels' own SHA256SUMS in ~/build/ohs-dist/shack-sdr-m2a match
# the lines below; 23b437c's (the DAB search always moving on) are replaced,
# and that fix is in this build too.
# 23b437c before it: the DAB search always moves on after a NoPrs
# miss. Before it, a fade just past the start of the samples the search
# held made it search the same samples for ever, and the decoder host's
# one thread spun at 100 % while every session starved (ohs-box, Store
# Radio 0.1.22-beta.5).
# 0.2.0 replaces 0.1.0 (dfcb334) for d62bafe: the RTTY decoder took its
# frames' noise floor from a stale spectrum and printed one to three
# characters of noise after an over ended, where rtty.py printed none
# (NB's own-echo test, 3 runs in 5). One line per platform, its tag in the comment; a bump is a commit
# of its own (REPO-LAYOUT 4), with new wheels, new lines and the old wheels
# deleted.
#
# Committed beside the pure ohs-libs wheels (requirements.lock), unlike
# ohsdigi's (ohsdigi.lock): ohsdigi's Linux and Windows modules are made
# from this tree at release time (tools/build-ohsdigi.sh), but shack-sdr's
# source is in ohs-libs, so a checkout, the suite, the .deb and the
# Windows build host could not make it from here, and RTTY - in both apps,
# since the mode table is shared - decodes with nothing else. 4.3 MB for
# the three since PSK and SSTV came in (3.6 with DAB and FM, 2.1 before).
#
# A checkout imports it through ohscore/shacklibs.py, which picks the
# wheel for this machine's OS and architecture; the packages unpack the
# one for their target (packaging/shack_vendor.py, the store
# Containerfiles), each checking it against these hashes first.
#
# There is no macOS wheel yet: the Mac's universal2 build has not run.
# Until one is pinned here, build-macos.sh (through shack_vendor.py) stops
# with that sentence rather than build a Radio that cannot decode RTTY.
shack-sdr==0.2.0 --hash=sha256:d3731efdbfb5690191988d8927383b4f64fa94c0ef49bfc81aca1441624aad86  # manylinux_2_35_x86_64
