# shack-sdr, the decoder host, the Rust RTTY decoder, the runtime codec
# loader and the receive-only RTL-SDR and SDRplay sources
# (openhamshack docs/RADIO-SDR-PLAN.md, Milestone 1). Built by ohs-libs
# tools/build-sdr-wheels.sh at ohs-libs main a921f90 (22/10/2026; still
# 0.2.0 - antenna/input selection on the two sources, no version bump),
# the wheels' own SHA256SUMS in ~/build/ohs-dist/shack-sdr matching the
# lines below.
# 0.2.0 replaces 0.1.0 (dfcb334) for d62bafe: the RTTY decoder took its
# frames' noise floor from a stale spectrum and printed one to three
# characters of noise after an over ended, where rtty.py printed none
# (NB's own-echo test, 3 runs in 5). One line per platform, its tag in the comment; a bump is a commit
# of its own (REPO-LAYOUT 4), with new wheels, new lines and the old wheels
# deleted.
#
# Committed beside the pure ohs-libs wheels (requirements.lock), unlike
# ohsdigi's (ohsdigi.lock): ohsdigi's Linux and Windows modules are made
# from this tree at release time (tools/build-ohsdigi.sh), but shack-sdr's
# source is in ohs-libs, so a checkout, the suite, the .deb and the
# Windows build host could not make it from here, and RTTY - in both apps,
# since the mode table is shared - decodes with nothing else. 2.1 MB for
# the three.
#
# A checkout imports it through ohscore/shacklibs.py, which picks the
# wheel for this machine's OS and architecture; the packages unpack the
# one for their target (packaging/shack_vendor.py, the store
# Containerfiles), each checking it against these hashes first.
#
# There is no macOS wheel yet: the Mac's universal2 build has not run.
# Until one is pinned here, build-macos.sh (through shack_vendor.py) stops
# with that sentence rather than build a Radio that cannot decode RTTY.
shack-sdr==0.2.0 --hash=sha256:0f4774739be269d0a0a047f22af2edb23178f6cebf416b007b1734c6c92abf21  # manylinux_2_35_x86_64
shack-sdr==0.2.0 --hash=sha256:960eb0d90303ac3b8b90cb87040eb595f5b63ad3f9871d9fc2808a14c310255f  # manylinux_2_35_aarch64
shack-sdr==0.2.0 --hash=sha256:b45c78f63c78f3e058854b6abe93e858ea903a8e8045524362169805ccb0d86d  # win_amd64
